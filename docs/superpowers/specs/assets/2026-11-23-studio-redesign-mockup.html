<!DOCTYPE html>
<html lang="en" data-theme="dark" data-nodes="iso">
<head>
<meta charset="utf-8">
<title>Archwise Studio — mockup v4 (interactive)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root[data-theme="dark"]{
  --bg:#14161b; --panel:#1b1e25; --panel-2:#222631; --line:#343a48; --ink:#e9e4da; --ink-2:#a8a293; --ink-3:#6f6a60;
  --grid:rgba(233,228,218,.05); --stroke:#0c0d10; --outline:rgba(233,228,218,.55); --shadow:#07080a; --accent:#e8b04b; --accent-ink:#1b1408;
  --plinth:#2c313d; --msg:#f1ece2; --fe:#6cc4b4; --svc:#7aa6e0; --ds:#b49be0; --q:#e8b04b; --ext:#e58f8f; --job:#a9cf72; --mod:#8f96a6;
}
:root[data-theme="light"]{
  --bg:#f3ede3; --panel:#fbf8f2; --panel-2:#f1ebe0; --line:#d6cdbd; --ink:#1f1c18; --ink-2:#5d564b; --ink-3:#958c7d;
  --grid:rgba(31,28,24,.07); --stroke:#1f1c18; --outline:#1f1c18; --shadow:#1f1c18; --accent:#d9902a; --accent-ink:#1b1408;
  --plinth:#e7ddcc; --msg:#ffffff; --fe:#9fd8cc; --svc:#a9c5ea; --ds:#cdbbea; --q:#f3cf8a; --ext:#f0b3b0; --job:#c9e2a0; --mod:#c8ccd4;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.5 "JetBrains Mono",ui-monospace,Menlo,monospace;}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:52px 1fr;height:100vh}
.top{display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.brand svg{width:26px;height:26px}
.ws{color:var(--ink-2);display:flex;gap:8px;align-items:center}
.ws b{color:var(--ink);font-weight:500}
.tabs{display:flex;gap:4px;margin-left:12px}
.tab{padding:6px 12px;border-radius:8px;border:1px solid transparent;color:var(--ink-2);background:none;cursor:pointer}
.tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--stroke);box-shadow:2px 2px 0 var(--shadow);font-weight:500}
.spacer{flex:1}
.search{width:280px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);color:var(--ink);outline:none}
.search::placeholder{color:var(--ink-3)}
.ctl{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);cursor:pointer}
.main{display:grid;grid-template-columns:260px 1fr 340px;gap:14px;padding:14px;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:0}
.left{display:flex;flex-direction:column;padding:14px;gap:2px;overflow:auto}
.h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between;margin:10px 0 4px}
.group{display:flex;align-items:center;gap:8px;padding:6px 6px 2px;color:var(--ink-2)}
.sw{width:12px;height:12px;border-radius:3px;border:1.5px solid var(--stroke)}
.group .n{margin-left:auto;color:var(--ink-3)}
.item{padding:5px 8px 5px 26px;border-radius:7px;cursor:pointer;display:flex;gap:8px;align-items:center;border:1px solid transparent}
.item:hover{background:var(--panel-2)}
.item.on{background:var(--panel-2);border-color:var(--accent)}
.item i{font-style:normal;color:var(--ink-3);margin-left:auto;font-size:11px}
.item.inf::before{content:"";border:1.5px dashed var(--ink-3);border-radius:3px;width:9px;height:9px;margin-left:-17px}
.gapbox{margin-top:auto;border:1px dashed var(--line);border-radius:10px;padding:10px;color:var(--ink-2)}
.gapbox b{color:var(--ink)}
.center{display:grid;grid-template-rows:auto auto 1fr auto;min-height:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;padding:14px 16px 8px}
.crumb{color:var(--ink-3);font-size:12px}
.title{font-size:22px;font-weight:700;margin:2px 0 0}
.chips{display:flex;gap:6px}
.chip{border:1.5px solid var(--stroke);border-radius:8px;padding:3px 9px;font-size:12px;background:var(--panel-2);box-shadow:1.5px 1.5px 0 var(--shadow)}
.stats{display:flex;gap:8px;padding:0 16px 10px}
.stat{border:1px solid var(--line);border-radius:9px;padding:6px 12px;min-width:110px;background:var(--panel-2)}
.stat small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.stat b{font-size:17px}
.seg{margin-left:auto;display:flex;align-self:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 12px;cursor:pointer;color:var(--ink-2)}
.seg button.on{background:var(--panel-2);color:var(--ink);font-weight:500}
.canvas{position:relative;margin:0 12px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);cursor:grab;user-select:none}
.canvas.panning{cursor:grabbing}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.legend{position:absolute;left:12px;bottom:10px;display:flex;gap:14px;color:var(--ink-3);font-size:11px;pointer-events:none}
.legend span{display:flex;gap:6px;align-items:center}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:30px;height:30px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink-2);cursor:pointer}
.zoom button:hover{color:var(--ink);border-color:var(--ink-3)}
.zl{position:absolute;right:10px;top:112px;color:var(--ink-3);font-size:11px}
.hint{position:absolute;right:56px;bottom:10px;transform:translateX(-50%);color:var(--ink-3);font-size:11px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px;pointer-events:none}
.timeline{padding:10px 16px 14px}
.tl{display:flex;align-items:center;margin-top:8px}
.dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink-2);display:grid;place-items:center;font-size:10px;background:var(--panel);flex:none;cursor:pointer}
.dot.on{background:var(--accent);border-color:var(--stroke);color:var(--accent-ink);box-shadow:1.5px 1.5px 0 var(--shadow)}
.bar{height:2px;background:var(--ink-2);flex:1}
.tll{display:flex;justify-content:space-between;color:var(--ink-3);font-size:11px;margin-top:4px}
.right{display:flex;flex-direction:column;padding:16px;gap:10px;overflow:auto}
.kind{display:flex;justify-content:space-between;align-items:center}
.badge{font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1.5px solid var(--stroke);border-radius:6px;padding:2px 7px;box-shadow:1.5px 1.5px 0 var(--shadow);color:#1b1408}
.right h2{margin:0;font-size:20px}
.muted{color:var(--ink-2)}
.key{border:1.5px solid var(--stroke);border-radius:10px;padding:10px 12px;box-shadow:2px 2px 0 var(--shadow)}
.key small{display:block;font-size:10px;letter-spacing:.08em;color:var(--ink-2);text-transform:uppercase;margin-bottom:2px}
.evr{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--panel-2);margin-bottom:6px}
.evr code{color:var(--ink)}
.evr .k{color:var(--ink-3);font-size:11px}
.rel{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:4px 6px;border-radius:7px;cursor:pointer}
.rel:hover{background:var(--panel-2)}
.pill{border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--ink-2)}
.empty{color:var(--ink-3);margin:auto;text-align:center;line-height:1.8}
/* svg */
.node{cursor:pointer}
.node .face{stroke:var(--outline);stroke-width:1.6;stroke-linejoin:round}
.node .edgeline{stroke:var(--outline);stroke-width:1.2;opacity:.55}
.node .band{fill:none;stroke:var(--outline);stroke-width:1.2;opacity:.6}
.node .slot{fill:color-mix(in srgb,var(--stroke) 70%,transparent);stroke:var(--outline);stroke-width:.8}
.node .slotline{stroke:color-mix(in srgb,var(--ink) 30%,transparent);stroke-width:2;stroke-linecap:round}
.node .led{fill:#8fe07a}.node .led2{fill:var(--accent)}
.node .vent{stroke:color-mix(in srgb,black 35%,transparent);stroke-width:3;stroke-linecap:round}
.node .topmark{fill:color-mix(in srgb,white 35%,transparent);stroke:var(--outline);stroke-width:1}
.node .glyphline{fill:none;stroke:var(--stroke);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.node .keys{fill:color-mix(in srgb,black 18%,transparent)}
.node .screen{fill:#10131a;stroke:var(--outline);stroke-width:.8}
.node .chrome{fill:#2a2f3b}.node .dot1{fill:#e58f8f}.node .dot2{fill:#e8b04b}.node .dot3{fill:#8fe07a}
.node .txt{fill:#4a5163}
.node .roller{fill:color-mix(in srgb,var(--stroke) 75%,transparent);stroke:var(--outline);stroke-width:1}
.node .hub{fill:var(--ink-3)}
.node .spoke{stroke:var(--ink-3);stroke-width:1.6;stroke-linecap:round}
.node .cursor{fill:#8fe07a}
.node .belt{fill:#2a2e38;stroke:var(--outline);stroke-width:.8}
.node .slat{stroke:#3b4150;stroke-width:1.4}
.node .flowarrow{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.node .flap{fill:none;stroke:#8a8476;stroke-width:1.4;stroke-linejoin:round}
.node .magstripe{fill:#2a2e38}
.node .chip{fill:#d9b45a;stroke:#8a7030;stroke-width:.8}
.node .key{fill:color-mix(in srgb,white 55%,transparent);stroke:var(--outline);stroke-width:.6}
.node .slotdark{fill:#1a1d24}
.node .okline{stroke:#8fe07a;stroke-width:3;stroke-linecap:round}
.node .scrtxt{fill:#8fe07a;font:700 11px "JetBrains Mono",monospace}
.node .globe{fill:none;stroke:var(--stroke);stroke-width:1.3;opacity:.55}
.node.inferred .face{stroke-dasharray:5 4}
.node .pl .face{stroke-dasharray:none;opacity:.9}
.node .selring{fill:none;stroke:transparent;stroke-width:3}
.node.sel .selring{stroke:var(--accent)}
.node.dim{opacity:.35}
.lbl rect{fill:var(--panel);stroke:var(--outline);stroke-width:1.4}
.node.sel .lbl rect{stroke:var(--accent);stroke-width:2}
.lbl text{fill:var(--ink);font:500 13px "JetBrains Mono",monospace}
.lbl .sub{fill:var(--ink-3);font-size:10.5px;font-weight:400}
.edge path{stroke:var(--ink-2);stroke-width:1.8;fill:none}
.edge.inf path{stroke-dasharray:6 5;stroke:var(--ink-3)}
.edge.hot path{stroke:var(--accent);stroke-width:2.4}
.edge.dim{opacity:.25}
.elbl rect{fill:var(--panel-2);stroke:var(--line);stroke-width:1}
.edge.hot .elbl rect{stroke:var(--accent)}
.elbl text{fill:var(--ink-2);font:11px "JetBrains Mono",monospace}
.flow{fill:var(--accent);stroke:var(--stroke);stroke-width:1.2}
.flat rect.box{stroke:var(--outline);stroke-width:1.8}
.node.inferred .flat rect.box{stroke-dasharray:5 4}
.node.sel .flat rect.box{stroke:var(--accent);stroke-width:3}
.flat text{fill:#1b1408;font:500 13px "JetBrains Mono",monospace}
.flat .t{font-size:10px;letter-spacing:.06em}

.right{padding:18px 18px 14px;gap:0}
.ihead{display:flex;gap:12px;align-items:center}
.mini{width:64px;height:68px;flex:none}
.iname{font-size:22px;font-weight:700;line-height:1.1}
.ikind{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);margin-top:4px}
.ikind::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--c);border:1px solid var(--stroke)}
.isum{margin:12px 0 12px;color:var(--ink);font-size:13.5px;line-height:1.55}
.src{border-radius:10px;padding:9px 12px;font-size:12px;line-height:1.5;color:var(--ink-2);border:1px solid var(--line)}
.src b{display:block;color:var(--ink);font-size:12.5px;margin-bottom:1px}
.src.ok{border-left:4px solid #8fe07a}
.src.warn{border-left:4px dashed var(--accent)}
.itabs{display:flex;gap:2px;margin:16px 0 0;border-bottom:1px solid var(--line)}
.itabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;color:var(--ink-3);cursor:pointer;margin-bottom:-1px}
.itabs button b{font-weight:500;color:var(--ink-3);margin-left:2px}
.itabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.itabs button.on b{color:var(--accent)}
.ibody{padding-top:14px;display:flex;flex-direction:column;gap:6px}
.lbl2{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.why{font-size:13px;line-height:1.6;margin-bottom:14px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
.facts dt{color:var(--ink-3)} .facts dd{margin:0;text-align:right;color:var(--ink)}
.conn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel-2);border:1px solid transparent;border-radius:10px;padding:9px 10px;cursor:pointer;margin-bottom:6px}
.conn:hover{border-color:var(--accent)}
.cicon{width:14px;height:14px;border-radius:3px;background:var(--c);border:1.5px solid var(--stroke);flex:none}
.cbody{display:flex;flex-direction:column;min-width:0;flex:1}
.cname{font-weight:500;display:flex;gap:8px;align-items:baseline}
.ckind{color:var(--ink-3);font-size:11px;font-weight:400}
.cverb{color:var(--ink-2);font-size:12px}
.cvia{display:block;color:var(--ink-3);font-size:11px}
.cline line,.note2 line{stroke:var(--ink-2);stroke-width:2}
.note2{color:var(--ink-3);font-size:11px;margin-top:10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.file{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:8px}
.fname{background:var(--panel-2);padding:7px 10px;font-weight:500;display:flex;gap:8px;word-break:break-all}
.fname span{color:var(--ink-3)}
.fitem{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border-top:1px solid var(--line);color:var(--ink-2);font-size:12px}
.fitem code{color:var(--ink-3);white-space:nowrap}

.itabs button{white-space:nowrap;padding:8px 9px}
.iwrap{display:flex;flex-direction:column;min-width:0}
.iwhy{font-size:11px;color:var(--accent);opacity:.85;white-space:normal;line-height:1.35}
.item.inf::before{align-self:flex-start;margin-top:5px}
.src ul{margin:4px 0 6px;padding-left:16px;color:var(--ink)}
.src li{margin:2px 0}
.src .chk{color:var(--ink-3);font-size:11px}
.cwhy{color:var(--accent);font-size:11px;opacity:.9;margin-top:3px;line-height:1.4}
.cwhy.ok{color:var(--ink-3)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 28 10v12L16 29 4 22V10Z" fill="var(--accent)" stroke="var(--stroke)" stroke-width="1.8" stroke-linejoin="round"/><path d="M16 16 28 10M16 16 4 10M16 16v13" stroke="var(--stroke)" stroke-width="1.8"/></svg>
      Archwise
    </div>
    <div class="ws">/ <b>system-fixture</b> <span class="pill">rev 4</span></div>
    <nav class="tabs">
      <button class="tab on">Discover</button><button class="tab">Sandbox</button><button class="tab">Compare</button><button class="tab">Simulate</button>
    </nav>
    <div class="spacer"></div>
    <input class="search" id="search" placeholder="⌕ Find component…  (/)">
    <button class="ctl" id="nodesBtn">Nodes: isometric</button>
    <button class="ctl" id="themeBtn">◐ dark</button>
  </header>

  <div class="main">
    <aside class="card left" id="left"></aside>

    <section class="card center">
      <div class="head">
        <div><div class="crumb">system-fixture / System view</div><div class="title">How this system fits together</div></div>
        <div class="chips"><span class="chip">◷ scanned 2 min ago</span><span class="chip" style="background:color-mix(in srgb,var(--job) 40%,var(--panel-2))">✓ complete</span></div>
      </div>
      <div class="stats">
        <div class="stat"><small>Components</small><b>7</b></div>
        <div class="stat"><small>Relations</small><b>8</b></div>
        <div class="stat"><small>Observed</small><b>4</b></div>
        <div class="stat"><small>Inferred</small><b style="color:var(--accent)">3</b></div>
        <div class="stat"><small>Not analyzed</small><b>1</b></div>
        <div class="seg"><button class="on">System</button><button>All packages</button></div>
      </div>
      <div class="canvas" id="canvas">
        <svg id="svg">
          <defs>
            <pattern id="grid" width="34" height="20" patternUnits="userSpaceOnUse"><path d="M0 0 34 20M34 0 0 20" stroke="var(--grid)" stroke-width="1"/></pattern>
            <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--ink-2)"/></marker>
            <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--accent)"/></marker>
          </defs>
          <g id="world"><rect id="gridbg" x="-5000" y="-5000" width="10000" height="10000" fill="url(#grid)"/><g id="edges"></g><g id="nodes"></g></g>
        </svg>
        
        <div class="zoom"><button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">−</button><button id="zfit" title="Fit (drag to pan · scroll to zoom · drag nodes · esc clears)">⤢</button></div>
        <div class="zl" id="zl">100%</div>
        <div class="legend">
          <span><svg width="26" height="6"><line x1="0" y1="3" x2="26" y2="3" stroke="var(--ink-2)" stroke-width="2"/></svg>observed</span>
          <span><svg width="26" height="6"><line x1="0" y1="3" x2="26" y2="3" stroke="var(--ink-3)" stroke-width="2" stroke-dasharray="5 4"/></svg>inferred</span>
          <span><svg width="10" height="10"><circle cx="5" cy="5" r="4" fill="var(--accent)"/></svg>selected</span>
        </div>
      </div>
      <div class="timeline">
        <div class="h" style="margin:0"><span>Revision history</span><span>rev 4 of 4</span></div>
        <div class="tl"><div class="dot">1</div><div class="bar"></div><div class="dot">2</div><div class="bar"></div><div class="dot">3</div><div class="bar"></div><div class="dot on">4</div></div>
        <div class="tll"><span>first scan</span><span>+ worker</span><span>+ Redis</span><span>now · +Stripe</span></div>
      </div>
    </section>

    <aside class="card right" id="right"></aside>
  </div>
</div>

<script>
const KINDS = {
  frontend:{label:'Frontend',group:'Frontends',color:'--fe',shape:'block',glyph:'<rect x="-14" y="-30" width="28" height="12" rx="2"/>'},
  service:{label:'Service',group:'Services',color:'--svc',shape:'block',glyph:'<path d="M-14 -34h28M-14 -27h28M-14 -20h28"/>'},

  queue:{label:'Queue',group:'Queues',color:'--q',shape:'stack',glyph:''},
  external:{label:'External system',group:'External',color:'--ext',shape:'block',glyph:'<circle cx="0" cy="-26" r="9"/><path d="M-9 -26h18M0 -35v18"/>'},
};
const NODES = [
  {id:'web',reasons:['depends on react-dom','depends on vite'],summary:'The browser app people use.',kind:'frontend',conf:'inferred',x:0,y:210,sub:'frontend',path:'apps/web',source:'Node package',
   why:'It depends on <b>react-dom</b> and <b>vite</b>, which are browser UI libraries. Nothing proves it is deployed as a website, so this is inferred.',
   evidence:[['package manifest','apps/web/package.json'],['ui library · react-dom','apps/web/package.json'],['build tool · vite','apps/web/package.json']],
   aliases:['web','@acme/web'],config:[['Package','@acme/web'],['Scripts','dev, build, preview'],['Runtime deps','3'],['Dev deps','4']]},
  {id:'api',summary:'The backend that answers HTTP requests.',kind:'service',conf:'observed',x:390,y:170,sub:'service',path:'apps/api',source:'Node package + Compose',
   why:'It depends on <b>fastify</b>, an HTTP server library, and Compose runs it as service <b>api</b>.',
   evidence:[['package manifest','apps/api/package.json'],['server library · fastify','apps/api/package.json'],['compose service','compose.yaml : 12–19']],
   aliases:['api','@acme/api'],config:[['Package','@acme/api'],['Compose service','api'],['Build context','./apps/api'],['Ports','3000:3000'],['Depends on','db, cache']]},
  {id:'worker',summary:'A background process that runs queued jobs.',kind:'service',conf:'observed',x:450,y:480,sub:'service',path:'apps/worker',source:'Node package + Compose',
   why:'Compose runs it as service <b>worker</b>, and it depends on <b>bullmq</b> to consume jobs.',
   evidence:[['package manifest','apps/worker/package.json'],['compose service','compose.yaml : 20–26'],['queue library · bullmq','apps/worker/package.json']],

const SRC={observed:{t:'Confirmed',d:'Declared directly in your files.',cls:'ok'},inferred:{t:'Deduced',d:'No file declares it. Archwise deduced it from dependencies — check before relying on it.',cls:'warn'}};
function miniIcon(n){ const keep=gid; gid=5000+NODES.indexOf(n)*100; const svgs=`<svg viewBox="-82 -168 164 196" class="mini">${shapeIso(n)}</svg>`; gid=keep; return svgs; }
function connRow(other,e,dir){
  const o=byId[other];
  return `<button class="conn" data-id="${other}">
    <span class="cicon" style="--c:var(${KINDS[o.kind].color})"></span>
    <span class="cbody"><span class="cname">${other}<span class="ckind">${KINDS[o.kind].label}</span></span>
      <span class="cverb">${dir==='out'?e.verb:e.verb.replace(/^(\w+)/,'$1')}</span>${e.conf==='inferred'?`<span class="cwhy">inferred because ${e.reasons.join('; ')}</span>`:`<span class="cwhy ok">confirmed: ${e.label} in compose.yaml</span>`}</span>
    
  </button>`;
}
function renderRight(){
  if(!selected){ $('right').innerHTML=`<div class="empty">Select a component on the canvas<br>or in the list to see what it is,<br>what it connects to, and why.</div>`; return; }
  const n=byId[selected], k=KINDS[n.kind], src=SRC[n.conf];
  const out=EDGES.filter(e=>e.s===n.id), inn=EDGES.filter(e=>e.t===n.id);
  const files={}; for(const [what,where] of n.evidence){ const [file,lines]=where.split(' : '); (files[file]??=[]).push([what,lines]); }
  const tabs=[['overview','Overview'],['connections',`Links <b>${out.length+inn.length}</b>`],['evidence',`Evidence <b>${n.evidence.length}</b>`]];
  let body='';
  if(tab==='overview') body=`
    <div class="why"><div class="lbl2">Why Archwise thinks this is ${/^[aeiou]/i.test(k.label)?'an':'a'} ${k.label.toLowerCase()}</div>${n.why}</div>
    <dl class="facts">${n.config.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('')}<dt>Also called</dt><dd>${n.aliases.join(', ')}</dd></dl>`;
  if(tab==='connections') body=`
    ${out.length?`<div class="lbl2">Uses</div>${out.map(e=>connRow(e.t,e,'out')).join('')}`:''}
    ${inn.length?`<div class="lbl2" style="margin-top:14px">Used by</div>${inn.map(e=>connRow(e.s,e,'in')).join('')}`:''}
    `;
  if(tab==='evidence') body=Object.entries(files).map(([file,items])=>`
    <div class="file"><div class="fname"><span>▤</span>${file}</div>
      ${items.map(([what,lines])=>`<div class="fitem"><span>${what}</span>${lines?`<code>line ${lines}</code>`:''}</div>`).join('')}</div>`).join('')
    +`<div class="note2">Archwise reads only these files. It never runs your code or reads secrets.</div>`;
  $('right').innerHTML=`
    <div class="ihead">${miniIcon(n)}<div><div class="iname">${n.id}</div><div class="ikind" style="--c:var(${k.color})">${k.label}</div></div></div>
    <p class="isum">${n.summary}</p>
    ${n.conf==='inferred'?`<div class="src warn"><b>Inferred because:</b><ul>${n.reasons.map(r=>`<li>${r}</li>`).join('')}</ul><span class="chk">No file declares it directly. Check before relying on it.</span></div>`:`<div class="src ok"><b>Confirmed</b> Declared directly in ${[...new Set(n.evidence.map(e=>e[1].split(' : ')[0].split('/').pop()))].join(' and ')}.</div>`}
    <div class="itabs">${tabs.map(([id,l])=>`<button data-tab="${id}" class="${tab===id?'on':''}">${l}</button>`).join('')}</div>
    <div class="ibody">${body}</div>`;
}
function select(id){ selected=id; render(); renderLeft(); renderRight(); }

/* interaction: pan, zoom, drag node, click */
let drag=null;
svg.addEventListener('pointerdown',ev=>{
  const g=ev.target.closest('.node'); const pt={x:ev.clientX,y:ev.clientY};
  drag = g ? {type:'node',id:g.dataset.id,start:pt,moved:false} : {type:'pan',start:pt,ox:view.x,oy:view.y,moved:false};
  svg.setPointerCapture(ev.pointerId);
  if(!g) $('canvas').classList.add('panning');
});
svg.addEventListener('pointermove',ev=>{
  if(!drag) return;
  const dx=ev.clientX-drag.start.x, dy=ev.clientY-drag.start.y;
  if(Math.hypot(dx,dy)>3) drag.moved=true;
  if(!drag.moved) return;
  if(drag.type==='pan'){ view.x=drag.ox+dx; view.y=drag.oy+dy; applyView(); }
  else { const n=byId[drag.id]; n.x+=(ev.movementX)/view.k; n.y+=(ev.movementY)/view.k; render(); }
});
svg.addEventListener('pointerup',()=>{
  if(drag && !drag.moved){ if(drag.type==='node') select(drag.id); else select(null); }
  drag=null; $('canvas').classList.remove('panning');
});
svg.addEventListener('wheel',ev=>{ ev.preventDefault(); const r=svg.getBoundingClientRect(); zoomAt(Math.exp(-ev.deltaY*0.0015), ev.clientX-r.left, ev.clientY-r.top); },{passive:false});
$('zin').onclick=()=>{const r=svg.getBoundingClientRect(); zoomAt(1.2,r.width/2,r.height/2)};
$('zout').onclick=()=>{const r=svg.getBoundingClientRect(); zoomAt(1/1.2,r.width/2,r.height/2)};
$('zfit').onclick=fit;
$('left').addEventListener('click',ev=>{const it=ev.target.closest('.item[data-id]'); if(it) select(it.dataset.id)});
$('right').addEventListener('click',ev=>{const t=ev.target.closest('[data-tab]'); if(t){tab=t.dataset.tab; renderRight(); return;} const it=ev.target.closest('.conn[data-id]'); if(it) select(it.dataset.id)});
$('search').addEventListener('input',renderLeft);
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape') select(null); if(ev.key==='/' && document.activeElement!==$('search')){ev.preventDefault();$('search').focus()} });
$('themeBtn').onclick=()=>{const r=document.documentElement; r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'; $('themeBtn').textContent='◐ '+r.dataset.theme};
$('nodesBtn').onclick=()=>{const r=document.documentElement; r.dataset.nodes=r.dataset.nodes==='iso'?'flat':'iso'; $('nodesBtn').textContent='Nodes: '+(r.dataset.nodes==='iso'?'isometric':'flat'); render()};
window.addEventListener('resize',fit);
select('api'); requestAnimationFrame(fit);
</script>
</body>
</html>
