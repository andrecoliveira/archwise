name: One-time alpha integration quality gate
on:
  push:
    branches: [feat/svelte-flow-migration]
    paths:
      - '.github/workflows/feature-alpha-gate.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format new source and tests
        run: pnpm exec prettier --write apps/web/src/graph-types.ts apps/web/src/architecture-coach.test.ts scripts/tests/alpha-integration.test.mjs
      - name: Full repository check
        id: check
        continue-on-error: true
        run: pnpm check
      - name: Commit formatting and remove workflow
        if: always()
        run: |
          git rm .github/workflows/feature-alpha-gate.yml
          git add apps/web/src/graph-types.ts apps/web/src/architecture-coach.test.ts scripts/tests/alpha-integration.test.mjs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -s -m 'style: format validated alpha integration changes'
          git push origin HEAD:feat/svelte-flow-migration
      - name: Fail on check failure
        if: steps.check.outcome != 'success'
        run: exit 1
