name: One-time finalize Svelte web formatting
on:
  push:
    branches: [feat/svelte-flow-migration]
    paths: ['.github/workflows/feature-web-format.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec prettier --write apps/web/src/graph-types.test.ts apps/web/src/graph-types.ts
      - name: Remove temporary workflow and commit formatted files
        run: |
          git rm .github/workflows/feature-web-format.yml
          git add apps/web/src/graph-types.test.ts apps/web/src/graph-types.ts
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -s -m 'style(web): finalize Svelte graph schema formatting'
          git push origin HEAD:feat/svelte-flow-migration
