name: One-time semantic edge verification
on:
  push:
    branches: [feat/svelte-flow-migration]
    paths: ['.github/workflows/feature-semantic-validation.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec prettier --write apps/web/src/connection-intents.ts apps/web/src/connection-intents.test.ts apps/web/src/sandbox-persistence.ts apps/web/src/sandbox-persistence.test.ts apps/web/src/studio.css
      - name: Run full verification
        id: tests
        continue-on-error: true
        run: pnpm check
      - name: Publish format fixes and remove one-time workflow
        if: always()
        run: |
          git rm .github/workflows/feature-semantic-validation.yml
          git add apps/web/src/connection-intents.ts apps/web/src/connection-intents.test.ts apps/web/src/sandbox-persistence.ts apps/web/src/sandbox-persistence.test.ts apps/web/src/studio.css
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -s -m 'style(canvas): format semantic connections and persistence tests'
          git push origin HEAD:feat/svelte-flow-migration
      - name: Enforce test result
        if: steps.tests.outcome != 'success'
        run: exit 1
