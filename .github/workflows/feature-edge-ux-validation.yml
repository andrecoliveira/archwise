name: One-time Block 9.4 validation
on:
  push:
    branches: [feat/svelte-flow-migration]
    paths:
      - '.github/workflows/feature-edge-ux-validation.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format new TypeScript and CSS
        run: pnpm exec prettier --write apps/web/src/connection-validation.ts apps/web/src/connection-validation.test.ts apps/web/src/studio.css
      - name: Validate monorepo
        id: checks
        continue-on-error: true
        run: pnpm check
      - name: Remove temporary workflow and publish formatting
        if: always()
        run: |
          git rm .github/workflows/feature-edge-ux-validation.yml
          git add apps/web/src/connection-validation.ts apps/web/src/connection-validation.test.ts apps/web/src/studio.css
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -s -m 'style(edges): format connection validation and semantic edge CSS'
          git push origin HEAD:feat/svelte-flow-migration
      - name: Enforce verification
        if: steps.checks.outcome != 'success'
        run: exit 1
