name: One-time alpha end-to-end release gate
on:
  push:
    branches: [feat/svelte-flow-migration]
    paths:
      - '.github/workflows/feature-alpha-final.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec prettier --write apps/cli/tests/local-server.test.ts
      - name: Validate build, tests, and end-to-end HTTP smoke
        id: validation
        continue-on-error: true
        run: pnpm check
      - name: Commit formatting and remove temporary workflow
        if: always()
        run: |
          git rm .github/workflows/feature-alpha-final.yml
          git add apps/cli/tests/local-server.test.ts
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -s -m 'style(test): format local server regression'
          git push origin HEAD:feat/svelte-flow-migration
      - name: Fail if validation failed
        if: steps.validation.outcome != 'success'
        run: exit 1
