name: Browser Studio Smoke
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/cli/**'
      - 'packages/**'
      - 'scripts/browser-smoke.mjs'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - name: Install isolated browser driver
        run: npm install --prefix "$RUNNER_TEMP/archwise-playwright" --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - name: Exercise Studio against preinstalled Chrome
        env:
          ARCHWISE_BROWSER_CHANNEL: chrome
          ARCHWISE_PLAYWRIGHT_ENTRY: ${{ runner.temp }}/archwise-playwright/node_modules/playwright/index.mjs
        run: node scripts/browser-smoke.mjs
