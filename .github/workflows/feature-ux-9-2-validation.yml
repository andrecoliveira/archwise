name: One-time UX Block 9.2 quality gate
on:
  push:
    branches: [feat/svelte-flow-migration]
    paths: ['.github/workflows/feature-ux-9-2-validation.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format new TS and CSS
        run: pnpm exec prettier --write apps/web/src/component-catalog.ts apps/web/src/component-catalog.test.ts apps/web/src/studio.css
      - name: Run full quality suite
        id: tests
        continue-on-error: true
        run: pnpm check
      - name: Commit formatting and remove temporary workflow
        if: always()
        run: |
          git rm .github/workflows/feature-ux-9-2-validation.yml
          git add apps/web/src/component-catalog.ts apps/web/src/component-catalog.test.ts apps/web/src/studio.css
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -s -m 'style(ux): format canvas-first catalog and layout'
          git push origin HEAD:feat/svelte-flow-migration
      - name: Fail on verification error
        if: steps.tests.outcome != 'success'
        run: exit 1
