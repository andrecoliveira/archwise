name: One-time Svelte migration dependency sync
on:
  push:
    branches: [feat/svelte-flow-migration]
    paths:
      - '.github/workflows/feature-lock-sync.yml'
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm exec prettier --write apps/cli apps/web
      - name: Commit dependencies and formatting, remove one-time workflow
        run: |
          git rm .github/workflows/feature-lock-sync.yml
          git add pnpm-lock.yaml apps/cli apps/web
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -s -m 'chore(web): synchronize Svelte dependencies and formatting'
          git push origin HEAD:feat/svelte-flow-migration
