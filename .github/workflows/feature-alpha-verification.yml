name: One-time alpha integration verification
on:
  push:
    branches: [feat/svelte-flow-migration]
    paths:
      - '.github/workflows/feature-alpha-verification.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run repository checks
        id: checks
        continue-on-error: true
        run: pnpm check
      - name: Remove temporary verification workflow
        if: always()
        run: |
          git rm .github/workflows/feature-alpha-verification.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -s -m 'chore(ci): remove temporary alpha verification'
          git push origin HEAD:feat/svelte-flow-migration
      - name: Ensure success
        if: steps.check.outcome != 'success'
        run: exit 1
