name: One-time preinstalled Chrome Studio smoke
on:
  push:
    branches: [feat/svelte-flow-migration]
    paths: ['.github/workflows/feature-browser-chrome.yml']
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec prettier --write scripts/browser-smoke.mjs
      - name: Full code quality
        id: checks
        continue-on-error: true
        run: pnpm check
      - name: Install Playwright driver without downloading browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/archwise-playwright" --no-save --no-package-lock playwright@1.56.1
          which google-chrome
      - name: Run browser smoke against bundled Chrome
        id: browser
        continue-on-error: true
        env:
          ARCHWISE_BROWSER_CHANNEL: chrome
          ARCHWISE_PLAYWRIGHT_ENTRY: ${{ runner.temp }}/archwise-playwright/node_modules/playwright/index.mjs
        run: node scripts/browser-smoke.mjs
      - name: Clean temporary workflows and publish formatting
        if: always()
        run: |
          git rm -f .github/workflows/feature-browser-chrome.yml .github/workflows/feature-browser-24.yml
          git add scripts/browser-smoke.mjs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -s -m 'style(browser): format browser smoke and remove experimental workflows'
          git push origin HEAD:feat/svelte-flow-migration
      - name: Enforce quality and smoke
        if: steps.checks.outcome != 'success' || steps.browser.outcome != 'success'
        run: exit 1
